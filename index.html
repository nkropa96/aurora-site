<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Aurora Cabinet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f1219;
            color: #e6e8eb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .card {
            background: #171b26;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }
        .label {
            font-size: 12px;
            color: #8b92a1;
            margin-bottom: 4px;
        }
        .value {
            font-size: 14px;
            word-break: break-all;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-danger {
            background: #ef4444;
        }
        .subs-list {
            margin-top: 10px;
        }
        .sub-item {
            background: #1f2433;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }
        .sub-title {
            font-size: 14px;
            font-weight: 600;
        }
        .sub-meta {
            font-size: 12px;
            color: #8b92a1;
            margin-top: 4px;
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .status {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>🪐 Кабинет Aurora</h1>

        <div class="card">
            <div class="row">
                <div>
                    <div class="label">Telegram ID</div>
                    <div class="value" id="telegram-id">Загрузка...</div>
                </div>
                <div class="actions">
                    <button class="btn" onclick="loadSubs()">Обновить</button>
                </div>
            </div>
            <div class="row">
                <div>
                    <div class="label">Подписки</div>
                    <div class="value" id="subs-count">0</div>
                </div>
                <div class="status" id="load-status"></div>
            </div>
        </div>

        <div id="subs-container" class="subs-list">
            <div class="card">Загрузка подписок...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        const userId = user?.id;

        document.getElementById('telegram-id').textContent = userId || 'unknown';

        async function loadSubs() {
            const status = document.getElementById('load-status');
            const container = document.getElementById('subs-container');
            status.textContent = 'Загрузка...';

            try {
                const res = await fetch(`/api/subscriptions?user_id=${encodeURIComponent(userId)}`);
                const subs = await res.json();

                if (!Array.isArray(subs)) throw new Error('Bad response');

                document.getElementById('subs-count').textContent = subs.length;
                status.textContent = '';

                if (!subs.length) {
                    container.innerHTML = '<div class="card">У тебя пока нет подписок.</div>';
                    return;
                }

                container.innerHTML = subs.map(sub => `
                    <div class="sub-item">
                        <div class="sub-header">
                            <div class="sub-title">🔄 VLESS ${sub.country}</div>
                            <button class="btn btn-danger" onclick="deleteSub(${sub.id})">Удалить</button>
                        </div>
                        <div class="sub-meta">Email: ${sub.email}</div>
                        <div class="sub-meta">Срок: ${sub.expire_days} дней • ${sub.status}</div>
                        <div class="value" style="margin-top:8px; font-size:12px;">${sub.subscription_url}</div>
                    </div>
                `).join('');
            } catch (e) {
                status.textContent = 'Ошибка загрузки';
                container.innerHTML = '<div class="card">Ошибка загрузки подписок</div>';
            }
        }

        async function deleteSub(id) {
            await fetch('/api/delete-subscription', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, user_id: userId })
            });
            loadSubs();
        }

        if (userId) {
            loadSubs();
        } else {
            document.getElementById('subs-container').innerHTML = '<div class="card">Открой кабинет из Telegram.</div>';
        }
    </script>
</body>
</html>
