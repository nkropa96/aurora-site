<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Tunnel mini app</title>
  <meta name="color-scheme" content="dark light" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: #050816;
      color: #f9fafb;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      box-sizing: border-box;
    }

    .card {
      background: radial-gradient(circle at top left, rgba(56,189,248,0.35), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(167,139,250,0.35), transparent 55%),
                  #020617;
      border-radius: 16px;
      padding: 20px 18px 16px;
      box-shadow:
        0 20px 40px rgba(15,23,42,0.9),
        0 0 0 1px rgba(148,163,184,0.2);
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin: 0 0 16px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      color: #f9fafb;
      box-shadow: 0 8px 22px rgba(56,189,248,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn span.icon {
      font-size: 18px;
    }

    .btn-secondary {
      margin-top: 10px;
      background: transparent;
      border: 1px solid rgba(148,163,184,0.5);
      box-shadow: none;
      color: #e5e7eb;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="title">Aurora Tunnel</h1>
      <p class="subtitle">Нажми, чтобы получить новую VLESS‑ссылку.</p>

      <button class="btn" onclick="issueVless()">
        <span class="icon">⚡</span>
        <span>Выдать VLESS</span>
      </button>

      <button class="btn btn-secondary" onclick="openSupport()">
        <span class="icon">💬</span>
        <span>Поддержка</span>
      </button>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const statusEl = document.getElementById("status");

    function setStatus(text) {
      if (!statusEl) return;
      statusEl.textContent = text || "";
    }

    function issueVless() {
      try {
        const payload = { action: "issue_vless" };
        console.log("Sending to bot:", payload);
        setStatus("Запрашиваю VLESS у бота...");
        tg.sendData(JSON.stringify(payload));
        // Можно закрыть мини‑апп после отправки, если хочешь:
        // tg.close();
      } catch (e) {
        console.error("sendData error", e);
        setStatus("Ошибка отправки данных в бота");
      }
    }

    function openSupport() {
      try {
        const payload = { action: "support" };
        console.log("Sending support action:", payload);
        setStatus("Открываю поддержку...");
        tg.sendData(JSON.stringify(payload));
      } catch (e) {
        console.error("sendData error", e);
        setStatus("Ошибка отправки данных в бота");
      }
    }

    console.log("TG WebApp initDataUnsafe:", tg.initDataUnsafe);
  </script>
</body>
</html>
