<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Aurora Cabinet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f1219;
            color: #e6e8eb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .card {
            background: #171b26;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }
        .label {
            font-size: 12px;
            color: #8b92a1;
            margin-bottom: 4px;
        }
        .value {
            font-size: 14px;
            word-break: break-all;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-danger {
            background: #ef4444;
        }
        .subs-list {
            margin-top: 10px;
        }
        .sub-item {
            background: #1f2433;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .sub-title {
            font-size: 14px;
            font-weight: 600;
        }
        .sub-meta {
            font-size: 12px;
            color: #8b92a1;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>🪐 Кабинет Aurora</h1>

        <div class="card">
            <div class="row">
                <div class="label">Telegram ID</div>
                <div class="value" id="telegram-id">Загрузка...</div>
            </div>
            <div class="row">
                <div class="label">Подписки</div>
                <div class="value" id="subs-count">Загрузка...</div>
            </div>
        </div>

        <div id="subs-container" class="subs-list">
            <div class="card">Загрузка подписок...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        const userId = user?.id || 'unknown';

        document.getElementById('telegram-id').textContent = userId;

        // Эмуляция списка подписок (здесь потом можно добавить fetch к API)
        const mockSubs = [
            {
                id: 1,
                protocol: 'vless',
                country: 'RU',
                expire_days: 30,
                status: 'active',
                email: 'tg_' + userId + '_vless_abc123',
                url: 'https://89.125.188.229:2096/qwss/abcdef123456'
            }
        ];

        const subsContainer = document.getElementById('subs-container');
        if (mockSubs.length === 0) {
            subsContainer.innerHTML = '<div class="card">У тебя пока нет подписок.</div>';
        } else {
            subsContainer.innerHTML = '';
            mockSubs.forEach(sub => {
                const protocolEmoji = sub.protocol === 'vless' ? '🔄' : '⚡';
                const protocolName = sub.protocol === 'vless' ? 'VLESS' : 'AmneziaWG 2';
                const html = `
                    <div class="sub-item">
                        <div class="sub-header">
                            <div class="sub-title">${protocolEmoji} ${protocolName} ${sub.country}</div>
                            <button class="btn btn-danger" onclick="alert('Здесь будет удаление')">Удалить</button>
                        </div>
                        <div class="sub-meta">Строкa: ${sub.email}</div>
                        <div class="sub-meta">Срок: ${sub.expire_days} дней • ${sub.status}</div>
                        <div class="value" style="margin-top:8px; font-size:12px;">${sub.url}</div>
                    </div>
                `;
                subsContainer.insertAdjacentHTML('beforeend', html);
            });
        }

        document.getElementById('subs-count').textContent = mockSubs.length;
    </script>
</body>
</html>
