<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Cabinet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1219;
            --card: #171b26;
            --card2: #1f2433;
            --text: #e6e8eb;
            --muted: #8b92a1;
            --blue: #3b82f6;
            --red: #ef4444;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,.25);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        .label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 14px;
            word-break: break-word;
        }

        .muted {
            color: var(--muted);
        }

        .btn {
            border: 0;
            background: var(--blue);
            color: white;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-danger {
            background: var(--red);
        }

        .btn-secondary {
            background: #334155;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .subs {
            display: grid;
            gap: 12px;
        }

        .sub {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }

        .sub-head {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .sub-title {
            font-size: 16px;
            font-weight: 600;
        }

        .sub-grid {
            display: grid;
            gap: 8px;
        }

        .status-ok {
            color: var(--green);
            font-weight: 600;
        }

        .status-bad {
            color: var(--red);
            font-weight: 600;
        }

        .notice {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
        }

        .notice h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .notice p {
            margin: 8px 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .link {
            color: #93c5fd;
            word-break: break-word;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
        }

        .empty {
            padding: 16px;
            color: var(--muted);
        }

        .debug {
            font-size: 12px;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
            background: #0b1020;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>🪐 Aurora Cabinet</h1>
            <div class="top">
                <div>
                    <div class="label">Telegram ID</div>
                    <div class="value" id="telegram-id">загрузка...</div>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" id="refresh-btn">Обновить</button>
                </div>
            </div>
        </div>

        <div id="content"></div>

        <div class="card">
            <div class="label">Отладка</div>
            <div class="debug" id="debug-box">...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://89.125.188.229:8080';
        const BOT_LINK = 'https://t.me/AURORA_TUNNEL_BOT';

        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        const content = document.getElementById('content');
        const telegramIdEl = document.getElementById('telegram-id');
        const refreshBtn = document.getElementById('refresh-btn');
        const debugBox = document.getElementById('debug-box');

        function setDebug(lines) {
            debugBox.textContent = lines.join('\n');
        }

        function renderBrowserStub(reason) {
            telegramIdEl.textContent = 'browser';
            content.innerHTML = `
                <div class="notice">
                    <h2>Открой в Telegram</h2>
                    <p>Этот кабинет работает только внутри Telegram WebApp.</p>
                    <p>Открытие из обычного браузера даёт заглушку и кнопку перехода в бота.</p>
                    <div class="actions" style="margin-top:14px;">
                        <a class="btn" href="${BOT_LINK}" target="_blank" rel="noopener noreferrer">Открыть бота</a>
                    </div>
                    <p class="small">Причина: ${reason}</p>
                </div>
            `;
            refreshBtn.disabled = true;
        }

        async function apiGetSubscriptions(userId) {
            const res = await fetch(`${API_BASE}/api/subscriptions?user_id=${encodeURIComponent(userId)}`);
            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch {
                throw new Error('API returned non-JSON: ' + text.slice(0, 200));
            }
            return data;
        }

        async function apiDeleteSubscription(userId, id) {
            const res = await fetch(`${API_BASE}/api/delete-subscription`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, id })
            });
            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch {
                throw new Error('Delete API returned non-JSON: ' + text.slice(0, 200));
            }
            return data;
        }

        function escapeHtml(text) {
            return String(text)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        async function loadSubs() {
            if (!tg) {
                setDebug([
                    'Telegram.WebApp: not found',
                    'Page opened outside Telegram'
                ]);
                renderBrowserStub('Telegram.WebApp not found');
                return;
            }

            const user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
            const userId = user ? user.id : null;
            const initData = tg.initData || '';

            setDebug([
                'Telegram.WebApp: found',
                'initData length: ' + initData.length,
                'userId: ' + (userId || 'EMPTY'),
                'user name: ' + (user ? (user.first_name || '') : 'EMPTY')
            ]);

            if (!userId) {
                telegramIdEl.textContent = 'EMPTY';
                content.innerHTML = `
                    <div class="notice">
                        <h2>Нет данных пользователя</h2>
                        <p>Telegram WebApp открыл страницу, но user.id не передан.</p>
                        <p>Открой кабинет ещё раз через кнопку WebApp в боте.</p>
                        <div class="actions" style="margin-top:14px;">
                            <a class="btn" href="${BOT_LINK}" target="_blank" rel="noopener noreferrer">Перейти в бота</a>
                        </div>
                    </div>
                `;
                return;
            }

            telegramIdEl.textContent = userId;
            content.innerHTML = `
                <div class="card">
                    <div class="muted">Загрузка подписок...</div>
                </div>
            `;

            try {
                const subs = await apiGetSubscriptions(userId);

                if (!Array.isArray(subs) || subs.length === 0) {
                    content.innerHTML = `
                        <div class="card">
                            <div class="empty">У вас пока нет подписок.</div>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = `
                    <div class="card">
                        <div class="top">
                            <div>
                                <div class="label">Подписок</div>
                                <div class="value">${subs.length}</div>
                            </div>
                            <div class="small">Данные берутся из SQLite</div>
                        </div>
                    </div>
                    <div class="subs">
                        ${subs.map(sub => `
                            <div class="sub">
                                <div class="sub-head">
                                    <div>
                                        <div class="sub-title">VLESS • ${escapeHtml(sub.country || '—')}</div>
                                        <div class="small">ID: ${sub.id}</div>
                                    </div>
                                    <div class="${sub.status === 'active' ? 'status-ok' : 'status-bad'}">
                                        ${escapeHtml(sub.status || 'unknown')}
                                    </div>
                                </div>

                                <div class="sub-grid">
                                    <div>
                                        <div class="label">Email</div>
                                        <div class="value">${escapeHtml(sub.email || '')}</div>
                                    </div>

                                    <div>
                                        <div class="label">Срок</div>
                                        <div class="value">${escapeHtml(sub.expire_days || '')} дней</div>
                                    </div>

                                    <div>
                                        <div class="label">Создано</div>
                                        <div class="value">${escapeHtml(sub.created_at || '')}</div>
                                    </div>

                                    <div>
                                        <div class="label">Ссылка подписки</div>
                                        <div class="value link">${escapeHtml(sub.subscription_url || '')}</div>
                                    </div>
                                </div>

                                <div class="actions" style="margin-top:12px;">
                                    <button class="btn btn-danger" onclick="deleteSub(${sub.id})">Удалить</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) {
                setDebug([
                    'Telegram.WebApp: found',
                    'userId: ' + userId,
                    'API error: ' + e.message
                ]);
                content.innerHTML = `
                    <div class="card">
                        <div class="status-bad">Не удалось загрузить подписки.</div>
                        <div class="small" style="margin-top:8px;">Проверь API и доступность сервера.</div>
                    </div>
                `;
            }
        }

        async function deleteSub(id) {
            const userId = tg?.initDataUnsafe?.user?.id;
            if (!userId) return;

            try {
                await apiDeleteSubscription(userId, id);
                await loadSubs();
            } catch (e) {
                alert('Не удалось удалить подписку');
            }
        }

        refreshBtn.addEventListener('click', loadSubs);

        if (tg && tg.ready) tg.ready();
        loadSubs();
    </script>
</body>
</html>
